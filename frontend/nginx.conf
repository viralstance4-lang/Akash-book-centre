server {
  listen 80;
  server_name _;

  # nginx's stock default is 1MB — print orders upload PDFs up to 200MB each
  # (up to 10 per order, per multer's limits in printorders.routes.ts and the
  # admin-configurable maxPdfsPerOrder setting), so the default silently 413s
  # any real print-order submission before it ever reaches the backend.
  # 200MB x 10 files = 2000MB max, with headroom for multipart overhead.
  client_max_body_size 2200m;

  root /usr/share/nginx/html;
  index index.html;

  # nginx's stock mime.types has no entry for .mjs — without this it falls back
  # to the default_type (application/octet-stream), and browsers refuse to
  # execute an ES-module Worker (pdf.js's worker) served with the wrong MIME type.
  location ~* \.mjs$ {
    default_type application/javascript;
  }

  location /api/ {
    proxy_pass http://backend:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
